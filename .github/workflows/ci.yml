name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository hygiene
        run: python tools/hygiene/check.py --commits

      - name: Configure
        run: cmake --preset vs -DHOLY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset vs

      - name: Test
        run: ctest --preset vs
